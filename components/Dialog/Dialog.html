<dialog class="dialog">
  <div class="dialog__surface">
    <header class="dialog__header">
      <span class="dialog__icon" data-ref="icon" hidden></span>
      <h2 class="dialog__title t-h3" data-ref="title"></h2>
      <span class="dialog__close" data-ref="close"></span>
    </header>
    <p class="dialog__description t-body-sm muted" data-ref="description" hidden></p>
    <div class="dialog__body" data-ref="body" hidden></div>
    <footer class="dialog__actions" data-ref="actions"></footer>
  </div>
</dialog>
