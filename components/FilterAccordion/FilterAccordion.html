<div class="accordion__item">
  <h3 class="accordion__heading">
    <button type="button" class="accordion__trigger" data-ref="trigger" aria-expanded="false">
      <span data-ref="label"></span>
      <span class="accordion__count" data-ref="count" hidden></span>
      <span class="accordion__chevron" data-ref="chevron" aria-hidden="true"></span>
    </button>
  </h3>
  <div class="accordion__panel" data-ref="panel" role="region" hidden></div>
</div>
