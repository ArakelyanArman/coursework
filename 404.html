<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title data-i18n="notFound.pageTitle"></title>

    <script src="js/theme-init.js"></script>

    <link rel="preload" href="assets/fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="assets/fonts/source-serif-4-var.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="i18n/translations.json" as="fetch" crossorigin />

    <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png" />
    <link rel="stylesheet" href="css/index.css" />
    <link rel="stylesheet" href="css/pages/not-found.css" />

    <script type="module" src="js/pages/not-found.js"></script>
  </head>
  <body>
    <main id="main">
      <div class="container">
        <section class="not-found" aria-labelledby="not-found-title">
          <span class="not-found__mark" id="not-found-mark"></span>
          <p class="t-caption caps muted" data-i18n="notFound.eyebrow"></p>
          <h1 class="t-display" id="not-found-title" data-i18n="notFound.title"></h1>
          <p class="t-body-lg muted" data-i18n="notFound.text"></p>
          <div class="not-found__search" id="not-found-search"></div>
          <div class="not-found__actions" id="not-found-actions"></div>
        </section>
      </div>
    </main>
  </body>
</html>
