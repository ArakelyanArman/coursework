<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="catalog.pageTitle"></title>
    <meta name="description" data-i18n-attr="content:meta.description" />

    <script src="js/theme-init.js"></script>

    <link rel="preload" href="assets/fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="assets/fonts/source-serif-4-var.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="i18n/translations.json" as="fetch" crossorigin />

    <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png" />
    <link rel="stylesheet" href="css/index.css" />
    <link rel="stylesheet" href="css/pages/catalog.css" />

    <script type="module" src="js/pages/catalog.js"></script>
  </head>
  <body>
    <main id="main">
      <div class="container catalog">
        <header class="catalog__header">
          <h1 class="t-h1" id="catalog-title" data-i18n="catalog.title"></h1>
          <p class="catalog__count t-body-sm muted tnum" id="catalog-count" role="status"></p>
        </header>

        <div class="catalog__layout">
          <aside class="catalog__side" aria-labelledby="catalog-filters-title">
            <h2 class="sr-only" id="catalog-filters-title" data-i18n="catalog.filters.title"></h2>
            <div id="catalog-search"></div>
            <div class="catalog__filter-button" id="catalog-filter-button"></div>
            <div class="catalog__filters" id="catalog-filters"></div>
          </aside>

          <section class="catalog__results" aria-labelledby="catalog-results-title">
            <h2 class="sr-only" id="catalog-results-title" data-i18n="catalog.resultsLabel"></h2>
            <div class="catalog__toolbar">
              <div class="catalog__categories" id="catalog-categories"></div>
              <div class="catalog__sort" id="catalog-sort"></div>
            </div>
            <div class="catalog__active" id="catalog-active" hidden></div>
            <div class="catalog__list" id="catalog-list" tabindex="-1"></div>
            <div class="catalog__pagination" id="catalog-pagination"></div>
          </section>
        </div>
      </div>
    </main>
  </body>
</html>
