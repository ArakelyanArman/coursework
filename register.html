<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title data-i18n="auth.register.pageTitle"></title>

    <script src="js/theme-init.js"></script>

    <link rel="preload" href="assets/fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="assets/fonts/source-serif-4-var.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="i18n/translations.json" as="fetch" crossorigin />

    <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png" />
    <link rel="stylesheet" href="css/index.css" />
    <link rel="stylesheet" href="css/pages/auth.css" />

    <script type="module" src="js/pages/register.js"></script>
  </head>
  <body>
    <main id="main" class="auth-page">
      <section class="auth-card" aria-labelledby="auth-title">
        <h1 class="t-h2 text-center" id="auth-title" data-i18n="auth.register.title"></h1>
        <form class="auth-form" id="auth-form" novalidate>
          <div id="auth-error" hidden></div>
          <div class="auth-form__fields" id="auth-fields"></div>
          <div class="auth-form__footer">
            <span class="auth-form__submit" id="auth-submit"></span>
            <p class="t-body-sm muted">
              <span data-i18n="auth.register.prompt"></span>
              <a class="auth-form__link" id="auth-switch" data-i18n="auth.register.link"></a>
            </p>
          </div>
        </form>
      </section>
    </main>
  </body>
</html>
